<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Golden Ladle — a timed kitchen game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #241610;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.5));
    height: min(100vh, calc(100vw / 1.5));
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game" width="1200" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
